name: CI

# Releasing is a button on the Actions tab, not a tag pushed from a laptop. Choose the bump, and the
# workflow works out the number, tags it, builds every platform and publishes the release.
#
# Cutting a version from a machine means the tag exists before anything has been proved, and the one
# that decides the version is whoever remembers the last one. Here the tag is created by the run
# itself, after the tests are green, so a tag that exists is a tag that built.
#
# Not on every push to main either: main is where the day's work lands, and a green tick on a commit
# nobody is shipping says nothing that building locally has not already said.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version à publier'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - patch
          - minor
          - major
      version:
        description: 'Numéro imposé, sans le v (laisser vide pour le calcul automatique)'
        required: false
        type: string
  pull_request:

# Two releases at once would race for the next number and produce two tags claiming the same one. A
# second run waits rather than being cancelled: half a release is worse than a late one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  # The vault has to behave identically on all three, so the tests run on all three. The device-key
  # tests use a fake OS key store precisely so they are not Windows-only.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release --verbosity normal

  # Works out the next number and stops there. The tag is created at the very end, by the release job,
  # once every platform has actually built.
  #
  # It used to be created here, and a run whose Windows arm64 job died downloading an action, a 429
  # from GitHub before a line of our code ran, left a tag behind with no release and consumed a
  # version number that nothing was ever published under. A number is cheap; a tag that names nothing
  # is a lie in the history.
  #
  # Skipped on a pull request, which takes the publishing jobs with it: they need this one.
  version:
    name: Version
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      number: ${{ steps.next.outputs.number }}
      prerelease: ${{ steps.next.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the previous tag is the only thing that says what comes next.
          fetch-depth: 0

      - id: next
        shell: bash
        run: |
          # Without this, git sorts v1.0.0-beta.1 after v1.0.0, and a beta would look newer than the
          # release it precedes. Semantic versioning says the opposite.
          git config versionsort.suffix -

          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          [ -z "$latest" ] && latest="v0.0.0"

          base=${latest#v}
          beta=""

          case "$base" in
            *-beta.*)
              beta=${base#*-beta.}
              base=${base%%-*}
              ;;
          esac

          IFS='.' read -r major minor patch <<< "$base"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0; beta="" ;;
            minor) minor=$((minor + 1)); patch=0; beta="" ;;
            # From a beta, patch is what releases it: v1.0.0-beta.3 becomes v1.0.0, not v1.0.1. The
            # betas were leading somewhere, and it is that. Same rule npm version follows.
            patch)
              [ -z "$beta" ] && patch=$((patch + 1))
              beta=""
              ;;
            beta)
              # Another beta on the same number, or the first one on the next patch.
              if [ -n "$beta" ]; then
                beta=$((beta + 1))
              else
                patch=$((patch + 1))
                beta=1
              fi
              ;;
          esac

          number="$major.$minor.$patch"
          [ -n "$beta" ] && number="$number-beta.$beta"

          # An imposed number wins. There is no bump that reaches v1.0.0-beta.1 from nothing, and
          # this is also the way out of a numbering mistake without hand-tagging.
          if [ -n "${{ inputs.version }}" ]; then
            number="${{ inputs.version }}"
            beta=""
            case "$number" in *-*) beta="imposed" ;; esac
          fi

          echo "tag=v$number" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "$beta" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$latest -> v$number"

  # Proves the "no runtime install required" promise for every platform we ship to, and that the
  # SQLCipher native libraries survive being bundled into a single file.
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    # Six runners for a proposed change is a lot of machine for a question the tests already answer,
    # so this waits on the version job, which is itself skipped on a pull request and takes this with
    # it. What publishing proves matters when a binary reaches someone.
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest }
          - { rid: win-arm64,   runner: windows-latest }
          - { rid: linux-x64,   runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-latest }
          - { rid: osx-x64,     runner: macos-latest }
          - { rid: osx-arm64,   runner: macos-latest }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Stamped with the version this run is cutting, so a binary someone sends back in a bug report
      # can say which one it is.
      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish src/Avocado.Cli -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }} -p:Version=${{ needs.version.outputs.number }}

      # The apphost is avocado.exe on Windows and avocado everywhere else. Resolved once, into the
      # environment, rather than re-derived by each step that needs it.
      #
      # It used to be `ls avocado avocado.exe | head -1`, which reads as "whichever of the two is
      # there" and is not: ls exits 2 when either name is missing, which is always, one of them is
      # the other platform's. Under `-e -o pipefail` that failed the job before the check it feeds
      # had run, so every publish job died with a bare "exit code 2" and no message.
      - name: Locate the published binary
        shell: bash
        run: |
          binary=artifacts/${{ matrix.rid }}/avocado
          [ -f "$binary" ] || binary=$binary.exe
          if [ ! -f "$binary" ]; then
            echo "::error::No avocado binary in artifacts/${{ matrix.rid }}."
            ls -la artifacts/${{ matrix.rid }}
            exit 1
          fi
          echo "BINARY=$binary" >> "$GITHUB_ENV"

      # A framework-dependent publish looks fine until a user without .NET installed tries to run it,
      # so assert the runtime really was bundled rather than trusting the property took effect.
      - name: Assert the publish is self-contained
        shell: bash
        run: |
          size=$(wc -c < "$BINARY")
          echo "$BINARY is $size bytes"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::Only $size bytes - the .NET runtime was not bundled."
            exit 1
          fi

      # Only where the runner can actually execute what was built; cross-compiled arm64 output cannot
      # run on an x64 runner.
      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          chmod +x "$BINARY" 2>/dev/null || true

          "$BINARY" create "$RUNNER_TEMP/smoke-vault" | tee create.log
          "$BINARY" info "$RUNNER_TEMP/smoke-vault"

          # Unlocks via the device key on every platform - DPAPI on Windows, the owner-only machine
          # key file on Linux and macOS. Nothing is read from stdin, so this hanging would itself be
          # the failure signal.
          "$BINARY" backup "$RUNNER_TEMP/smoke-vault" < /dev/null

          # And the recovery path, which is what a replacement machine would use.
          code=$(grep -oE '[0-9A-Z]{6}(-[0-9A-Z]{6}){8}' create.log | head -1)
          echo "$code" | "$BINARY" verify-recovery "$RUNNER_TEMP/smoke-vault"

      - uses: actions/upload-artifact@v4
        with:
          name: avocado-cli-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 7

  # The job above proves the vault; this one produces the thing a lawyer actually double-clicks. The
  # two are separate because they share nothing: this needs Node, the ASP.NET service rather than the
  # CLI, and electron-builder, and it has no smoke test to run because there is no headless way to
  # click through an installer.
  #
  # Nothing here is signed. A signing certificate is 200-400 €/an on Windows and 99 $/an on macOS,
  # which is not a cost this project carries, so the installers trip SmartScreen and Gatekeeper and
  # site/installation.html walks users through it. If that ever changes, it is credentials in the
  # environment and `identity`/`certificateFile` in app/package.json, not a different pipeline.
  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   runner: windows-latest, targets: '--win --x64' }
          - { rid: win-arm64, runner: windows-latest, targets: '--win --arm64' }
          - { rid: osx-x64,   runner: macos-latest,   targets: '--mac --x64' }
          - { rid: osx-arm64, runner: macos-latest,   targets: '--mac --arm64' }
          # linux-arm64 is deliberately absent. Cross-building an AppImage for it needs emulation and
          # breaks often, and a Linux user on arm64 is exactly the person who can run the CLI or build
          # from source. The desktop app on Linux means x64.
          - { rid: linux-x64, runner: ubuntu-latest,  targets: '--linux --x64' }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Where app/electron/backend.ts looks for it once packaged: extraResources copies
      # artifacts/backend to resources/backend, and the shell spawns Avocado.Server from there.
      - name: Publish the service into the app bundle
        shell: bash
        run: dotnet publish src/Avocado.Server -c Release -r ${{ matrix.rid }} -o artifacts/backend -p:Version=${{ needs.version.outputs.number }}

      - name: Install the app dependencies
        working-directory: app
        run: npm ci

      # Typechecks the renderer and the shell before bundling them; a build that only fails when a
      # lawyer opens the window is a build that shipped.
      - name: Build the renderer and the shell
        working-directory: app
        run: npm run build

      - name: Package the installers
        working-directory: app
        shell: bash
        run: npx electron-builder ${{ matrix.targets }} --publish never -c.extraMetadata.version=${{ needs.version.outputs.number }}

      - uses: actions/upload-artifact@v4
        with:
          # Blockmaps only exist to make delta auto-updates smaller, and Avocado does not auto-update.
          path: |
            app/release/Avocado-*
            !app/release/*.blockmap
          name: avocado-desktop-${{ matrix.rid }}
          retention-days: 7

  # The release is assembled from the artifacts the jobs above just proved, not from a second build,
  # so what is attached is what was tested.
  release:
    name: Release ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    needs: [version, publish, desktop]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: avocado-*
          path: artifacts

      # The installers arrive ready to attach, electron-builder having already named them
      # Avocado-<os>-<arch>.<ext>. The version is deliberately absent from those names: the site links
      # straight to /releases/latest/download/Avocado-win-x64.exe, which only resolves if the name is
      # the same in every release. That is what lets the download buttons be plain links, with no
      # JavaScript and no call to the GitHub API standing between a lawyer and the file.
      - name: Collect the installers
        run: |
          mkdir -p release
          find artifacts -path 'artifacts/avocado-desktop-*' -type f -exec cp {} release/ \;

      # The CLI still ships, one archive per platform, holding the binary and the licence and nothing
      # else. It is named avocado-cli- and not avocado- so that nobody looking for the application
      # downloads a command-line tool that opens no window.
      - name: Package the CLI for each platform
        run: |
          for directory in artifacts/avocado-cli-*; do
            rid=${directory#artifacts/avocado-cli-}
            stage=$(mktemp -d)
            cp LICENSE README.md "$stage/"

            if [ -f "$directory/avocado.exe" ]; then
              cp "$directory/avocado.exe" "$stage/"
              (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/release/avocado-cli-${{ needs.version.outputs.tag }}-$rid.zip" .)
            else
              cp "$directory/avocado" "$stage/"
              chmod +x "$stage/avocado"
              tar -czf "release/avocado-cli-${{ needs.version.outputs.tag }}-$rid.tar.gz" -C "$stage" .
            fi
          done

      # A vault holds a cabinet's files, so whoever downloads the thing that opens it should be able
      # to check they got what we built.
      - name: Checksum everything
        run: |
          (cd release && sha256sum Avocado-* avocado-cli-* > SHA256SUMS)
          ls -l release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A beta is a pre-release, and GitHub has to be told: /releases/latest/download, which every
          # download button on the site uses, skips pre-releases and keeps pointing at the last stable
          # one. That is the intended behaviour, and it only works if this flag is right.
          prerelease=""
          [ "${{ needs.version.outputs.prerelease }}" = "true" ] && prerelease=--prerelease

          # --target and not --verify-tag: this creates the tag, on the commit this run built, at the
          # same moment it publishes the release. Nothing tagged it earlier, deliberately, so that a
          # build which fails halfway leaves no tag naming a release that never happened.
          gh release create "${{ needs.version.outputs.tag }}" release/* \
            --target "${{ github.sha }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            $prerelease
