name: CI

# Runs when a version is cut, when someone proposes a change, or when asked. Not on every push to
# main: main is where the day's work lands, and a green tick on a commit nobody is shipping tells
# you nothing you did not already know from building locally.
#
# A tag is the release. Pushing v1.0.0 builds the six platforms, checks them, and publishes the
# GitHub release with the binaries attached. Nothing else creates a release, so the tag and what
# users download cannot describe different code.
on:
  push:
    tags:
      # Semantic versions only, so a scratch tag never ships anything. The second pattern is the
      # pre-release form, v1.0.0-beta.1, which is where this is starting.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  # The vault has to behave identically on all three, so the tests run on all three. The device-key
  # tests use a fake OS key store precisely so they are not Windows-only.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release --verbosity normal

  # Proves the "no runtime install required" promise for every platform we ship to, and that the
  # SQLCipher native libraries survive being bundled into a single file.
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    needs: test
    # Six runners for a proposed change is a lot of machine for a question the tests already answer.
    # What publishing proves matters when a binary reaches someone, so it runs on tags and on demand.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     runner: windows-latest }
          - { rid: win-arm64,   runner: windows-latest }
          - { rid: linux-x64,   runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-latest }
          - { rid: osx-x64,     runner: macos-latest }
          - { rid: osx-arm64,   runner: macos-latest }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Stamped with the tag on a release build, so a binary someone sends back in a bug report can
      # say which one it is. Untagged runs keep the default and are not meant to be kept.
      - name: Publish self-contained
        shell: bash
        run: |
          version=""
          case "$GITHUB_REF" in
            refs/tags/v*) version="-p:Version=${GITHUB_REF_NAME#v}" ;;
          esac
          dotnet publish src/Avocado.Cli -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }} $version

      # The apphost is avocado.exe on Windows and avocado everywhere else. Resolved once, into the
      # environment, rather than re-derived by each step that needs it.
      #
      # It used to be `ls avocado avocado.exe | head -1`, which reads as "whichever of the two is
      # there" and is not: ls exits 2 when either name is missing, which is always, one of them is
      # the other platform's. Under `-e -o pipefail` that failed the job before the check it feeds
      # had run, so every publish job died with a bare "exit code 2" and no message.
      - name: Locate the published binary
        shell: bash
        run: |
          binary=artifacts/${{ matrix.rid }}/avocado
          [ -f "$binary" ] || binary=$binary.exe
          if [ ! -f "$binary" ]; then
            echo "::error::No avocado binary in artifacts/${{ matrix.rid }}."
            ls -la artifacts/${{ matrix.rid }}
            exit 1
          fi
          echo "BINARY=$binary" >> "$GITHUB_ENV"

      # A framework-dependent publish looks fine until a user without .NET installed tries to run it,
      # so assert the runtime really was bundled rather than trusting the property took effect.
      - name: Assert the publish is self-contained
        shell: bash
        run: |
          size=$(wc -c < "$BINARY")
          echo "$BINARY is $size bytes"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::Only $size bytes - the .NET runtime was not bundled."
            exit 1
          fi

      # Only where the runner can actually execute what was built; cross-compiled arm64 output cannot
      # run on an x64 runner.
      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          chmod +x "$BINARY" 2>/dev/null || true

          "$BINARY" create "$RUNNER_TEMP/smoke-vault" | tee create.log
          "$BINARY" info "$RUNNER_TEMP/smoke-vault"

          # Unlocks via the device key on every platform - DPAPI on Windows, the owner-only machine
          # key file on Linux and macOS. Nothing is read from stdin, so this hanging would itself be
          # the failure signal.
          "$BINARY" backup "$RUNNER_TEMP/smoke-vault" < /dev/null

          # And the recovery path, which is what a replacement machine would use.
          code=$(grep -oE '[0-9A-Z]{6}(-[0-9A-Z]{6}){8}' create.log | head -1)
          echo "$code" | "$BINARY" verify-recovery "$RUNNER_TEMP/smoke-vault"

      - uses: actions/upload-artifact@v4
        with:
          name: avocado-cli-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 7

  # The job above proves the vault; this one produces the thing a lawyer actually double-clicks. The
  # two are separate because they share nothing: this needs Node, the ASP.NET service rather than the
  # CLI, and electron-builder, and it has no smoke test to run because there is no headless way to
  # click through an installer.
  #
  # Nothing here is signed. A signing certificate is 200-400 €/an on Windows and 99 $/an on macOS,
  # which is not a cost this project carries, so the installers trip SmartScreen and Gatekeeper and
  # site/installation.html walks users through it. If that ever changes, it is credentials in the
  # environment and `identity`/`certificateFile` in app/package.json, not a different pipeline.
  desktop:
    name: Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   runner: windows-latest, targets: '--win --x64' }
          - { rid: win-arm64, runner: windows-latest, targets: '--win --arm64' }
          - { rid: osx-x64,   runner: macos-latest,   targets: '--mac --x64' }
          - { rid: osx-arm64, runner: macos-latest,   targets: '--mac --arm64' }
          # linux-arm64 is deliberately absent. Cross-building an AppImage for it needs emulation and
          # breaks often, and a Linux user on arm64 is exactly the person who can run the CLI or build
          # from source. The desktop app on Linux means x64.
          - { rid: linux-x64, runner: ubuntu-latest,  targets: '--linux --x64' }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The version the tag names, or whatever package.json already says on a manual run. Resolved
      # once and reused, so the service, the app metadata and the file names cannot disagree.
      - name: Resolve the version
        shell: bash
        run: |
          version=$(node -p "require('./app/package.json').version")
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Where app/electron/backend.ts looks for it once packaged: extraResources copies
      # artifacts/backend to resources/backend, and the shell spawns Avocado.Server from there.
      - name: Publish the service into the app bundle
        shell: bash
        run: dotnet publish src/Avocado.Server -c Release -r ${{ matrix.rid }} -o artifacts/backend -p:Version=$VERSION

      - name: Install the app dependencies
        working-directory: app
        run: npm ci

      # Typechecks the renderer and the shell before bundling them; a build that only fails when a
      # lawyer opens the window is a build that shipped.
      - name: Build the renderer and the shell
        working-directory: app
        run: npm run build

      - name: Package the installers
        working-directory: app
        shell: bash
        run: npx electron-builder ${{ matrix.targets }} --publish never -c.extraMetadata.version=$VERSION

      - uses: actions/upload-artifact@v4
        with:
          # Blockmaps only exist to make delta auto-updates smaller, and Avocado does not auto-update.
          path: |
            app/release/Avocado-*
            !app/release/*.blockmap
          name: avocado-desktop-${{ matrix.rid }}
          retention-days: 7

  # Only a tag gets here. The release is assembled from the artifacts the jobs above just proved, not
  # from a second build, so what is attached is what was tested.
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [publish, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: avocado-*
          path: artifacts

      # The installers arrive ready to attach, electron-builder having already named them
      # Avocado-<os>-<arch>.<ext>. The version is deliberately absent from those names: the site links
      # straight to /releases/latest/download/Avocado-win-x64.exe, which only resolves if the name is
      # the same in every release. That is what lets the download buttons be plain links, with no
      # JavaScript and no call to the GitHub API standing between a lawyer and the file.
      - name: Collect the installers
        run: |
          mkdir -p release
          find artifacts -path 'artifacts/avocado-desktop-*' -type f -exec cp {} release/ \;

      # The CLI still ships, one archive per platform, holding the binary and the licence and nothing
      # else. It is named avocado-cli- and not avocado- so that nobody looking for the application
      # downloads a command-line tool that opens no window.
      - name: Package the CLI for each platform
        run: |
          for directory in artifacts/avocado-cli-*; do
            rid=${directory#artifacts/avocado-cli-}
            stage=$(mktemp -d)
            cp LICENSE README.md "$stage/"

            if [ -f "$directory/avocado.exe" ]; then
              cp "$directory/avocado.exe" "$stage/"
              (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/release/avocado-cli-${GITHUB_REF_NAME}-$rid.zip" .)
            else
              cp "$directory/avocado" "$stage/"
              chmod +x "$stage/avocado"
              tar -czf "release/avocado-cli-${GITHUB_REF_NAME}-$rid.tar.gz" -C "$stage" .
            fi
          done

      # A vault holds a cabinet's files, so whoever downloads the thing that opens it should be able
      # to check they got what we built.
      - name: Checksum everything
        run: |
          (cd release && sha256sum Avocado-* avocado-cli-* > SHA256SUMS)
          ls -l release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in a semantic version is what makes it a pre-release, and v1.0.0-beta.1 should
          # not be offered as the current one.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
          esac

          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
